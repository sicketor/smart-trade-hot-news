# Collects the hot news every ~15 minutes on weekdays (spec §5, §7). The cron covers both markets' windows in
# UTC across summer and winter time; the script itself checks each market's window and exits when none is open.
name: Collect hot news

on:
  schedule:
    - cron: "7-59/15 6-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Collect every market now, ignoring the windows"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect
        env:
          # A secret, not a variable: secrets are masked in this public repo's run logs.
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/collect.mjs ${{ inputs.force && '--force' || '' }}

      # Each run commits the data file; that also keeps the schedule alive (GitHub pauses idle schedules after 60 days).
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hot-news.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update hot news [skip ci]"
          git pull --rebase
          git push
